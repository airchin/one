<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE BOY Strategy Insights v21｜投放成效與 AI 策略模擬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>
:root{--bg0:#11345b;--bg1:#1a4673;--panel:rgba(20,51,85,.88);--panel2:rgba(31,70,108,.82);--line:rgba(120,190,255,.22);--line2:rgba(120,190,255,.38);
--text:#eaf4ff;--muted:#93acc8;--dim:#6a86a6;--goods:#d07a22;--cash:#1fa862;--data:#2a9ad4;--accent:#3cc8ff;--gold:#ffcc66;
--good:#2fbf71;--warn:#e9b33a;--serious:#e8792f;--crit:#e5484d;--font:"Noto Sans TC","Inter","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1b5a88 0%,#14375b 60%,#0c2038 100%);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--font);color:var(--text)}
#stage{position:fixed;inset:0}
#stage canvas{display:block;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.num{font-family:Inter,var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.5px;white-space:nowrap}
.tag.act{background:rgba(47,191,113,.16);color:#7be3a8;border:1px solid rgba(47,191,113,.4)}
.tag.demo{background:rgba(233,179,58,.14);color:#f3cf7a;border:1px solid rgba(233,179,58,.38)}
.tag.ver{background:rgba(120,160,255,.14);color:#a9c1ff;border:1px solid rgba(120,160,255,.38)}
/* top bar */
#top{position:fixed;left:12px;right:12px;top:10px;height:58px;z-index:10;display:flex;align-items:center;gap:14px;padding:0 14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:max-content}
.brand b{font:800 italic 26px Inter,sans-serif;letter-spacing:.5px}
.brand sup{font-size:10px}
.brand .t{font-weight:900;font-size:19px}
.brand .s{font-size:11px;color:var(--muted);display:block;margin-top:1px}
.tabs{display:flex;gap:6px;margin-left:8px}
.tab{border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--text);background:rgba(60,200,255,.08)}
.tab.on{color:#fff;background:linear-gradient(180deg,rgba(60,170,255,.45),rgba(30,110,220,.35));border-color:rgba(110,200,255,.6);box-shadow:0 0 18px rgba(60,170,255,.35)}
.period{margin-left:auto;display:flex;align-items:center;gap:8px}
.period select{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:13px}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:#7be3a8;border:1px solid rgba(47,191,113,.4);border-radius:999px;padding:5px 10px}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#2fbf71;box-shadow:0 0 8px #2fbf71;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.35}}
/* left column */
#left{position:fixed;left:12px;top:80px;width:300px;bottom:100px;z-index:9;display:flex;flex-direction:column;gap:10px;overflow:auto;scrollbar-width:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.kpi .l{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px}
.kpi .v small{font-size:12px;font-weight:700;color:var(--muted);margin-left:2px}
.kpi .d{font-size:11px;font-weight:700;margin-top:1px}
.up{color:#55d68c}.dn{color:#ff7b7f}
.sec{padding:12px}
.sec h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.tog{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:9px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:13px;font-weight:700;text-align:left}
.tog small{color:var(--muted);font-weight:500;font-size:11px}
.tog .sw{width:26px;height:0;border-top:3px solid;flex:none}
.tog .ck{margin-left:auto;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px}
.tog.on{background:rgba(60,170,255,.1);border-color:var(--line2)}
.tog.on .ck{background:var(--accent);border-color:var(--accent);color:#04203a}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.25);padding:3px;border-radius:9px;margin-bottom:8px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px 4px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:rgba(60,170,255,.35);color:#fff}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend span{margin-left:auto;color:var(--muted)}
/* right panel */
#right{position:fixed;right:12px;top:80px;width:400px;bottom:100px;z-index:9;display:flex;flex-direction:column;overflow:hidden}
#right .hd{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#right .hd h2{margin:0;font-size:20px;display:flex;align-items:center;gap:8px}
#right .hd .sub{font-size:12px;color:var(--muted);margin-top:4px}
#rbody{overflow:auto;padding:12px 16px 18px;flex:1;scrollbar-width:thin;scrollbar-color:#2a4a72 transparent}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.mini .kpi{padding:7px 8px}.mini .kpi .v{font-size:16px}
h5{font-size:12px;color:var(--muted);margin:14px 0 7px;font-weight:700;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--dim);font-weight:500;text-align:right;padding:4px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td.num{white-space:nowrap}td{padding:6px 4px;text-align:right;border-bottom:1px solid rgba(120,190,255,.08)}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(60,170,255,.08)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:3px}
.note{font-size:11px;color:var(--muted);line-height:1.6;background:rgba(255,255,255,.03);border:1px dashed var(--line);border-radius:9px;padding:8px 10px;margin-top:10px}
.insight{font-size:12px;line-height:1.65;background:rgba(60,170,255,.07);border-left:3px solid var(--accent);border-radius:6px;padding:8px 10px;margin-top:8px}
.insight b{color:#fff}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:fixed;z-index:50;pointer-events:none;background:#0b1d36f2;border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.4);display:none;max-width:260px}
.close{border:0;background:rgba(255,255,255,.07);border-radius:8px;width:30px;height:30px;cursor:pointer;margin-left:auto;font-size:16px}
.btn{border:1px solid var(--line2);background:rgba(60,170,255,.14);border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}
.btn:hover{background:rgba(60,170,255,.28)}
.btn.pri{background:linear-gradient(180deg,#2f9cf0,#1f6fd0);border-color:#5ab8ff}
.btn.warm{background:linear-gradient(180deg,#e0952e,#b8691a);border-color:#f0b060}
.row2{display:flex;gap:6px;flex-wrap:wrap}
/* bottom dock */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:9;display:flex;gap:8px;padding:8px}
.dk{width:118px;height:70px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(30,70,120,.55),rgba(10,30,60,.7));cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;position:relative;overflow:hidden}
.dk .ic{font-size:20px;line-height:1}
.dk:hover{border-color:var(--line2);box-shadow:0 0 16px rgba(60,170,255,.3)}
.dk.on{border-color:var(--gold);box-shadow:0 0 18px rgba(255,204,102,.35)}
.dk em{position:absolute;top:4px;right:5px;font-style:normal;font-size:9px;color:var(--gold)}
/* labels */
.pill{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;transform:translateY(-6px);user-select:none;transition:opacity .2s}
.pill .n{font-weight:900;font-size:13px;padding:4px 11px;border-radius:999px;background:linear-gradient(180deg,rgba(25,55,110,.95),rgba(12,30,64,.95));border:1px solid rgba(130,200,255,.55);box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 12px rgba(60,170,255,.25);white-space:nowrap}
.pill .v{font:700 11px Inter,sans-serif;margin-top:3px;padding:1px 7px;border-radius:6px;background:rgba(4,14,30,.78);color:#cfe6ff;white-space:nowrap}
.pill.hub .n{border-color:var(--gold);box-shadow:0 0 14px rgba(255,204,102,.4)}
.pill.sel .n{background:linear-gradient(180deg,#ffcf6a,#e39a2c);color:#1a1205;border-color:#ffe2a0;box-shadow:0 0 22px rgba(255,200,90,.7)}
.pill.dim{opacity:.35}
.pill.ov .n{background:linear-gradient(180deg,rgba(60,40,110,.95),rgba(30,20,70,.95));border-color:#b39cff}
.pill.small .v{display:none}
/* trace */
.step{display:flex;gap:10px;position:relative;padding:0 0 12px 0;cursor:pointer}
.step:before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:linear-gradient(var(--line2),transparent)}
.step:last-child:before{display:none}
.step .dot{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;background:#12305a;border:1.5px solid var(--line2);z-index:1}
.step.on .dot{background:var(--gold);color:#1a1205;border-color:#ffe2a0;box-shadow:0 0 14px rgba(255,204,102,.6)}
.step.done .dot{background:#1d5a8f;border-color:#5ab8ff}
.step .bx{flex:1;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.step.on .bx{border-color:rgba(255,204,102,.6);background:rgba(255,204,102,.07)}
.step .t1{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.step .t2{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.step code{font:600 11px ui-monospace,Menlo,monospace;color:#9fd4ff}
.sys{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:rgba(60,170,255,.16);color:#9fd4ff;white-space:nowrap}
.alert{border:1px solid rgba(229,72,77,.55);background:rgba(229,72,77,.1);border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.6;margin-top:8px}
.ai{border:1px solid rgba(179,156,255,.5);background:rgba(120,90,255,.1);border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.7;margin-top:8px}
.ai li{margin-left:-14px}
#loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#040b18;transition:opacity .6s}
#loader b{font:800 italic 48px Inter,sans-serif}
#loader span{color:var(--muted);margin-top:8px}
#err{color:#ff9a9a;font-size:13px;margin-top:14px;max-width:520px;white-space:pre-wrap}
#foot{position:fixed;right:14px;bottom:4px;z-index:8;font-size:10px;color:var(--dim)}
@media (max-width:1280px){#left{width:260px}#right{width:340px}.dk{width:96px}}
@media (max-width:900px){#left,#dock{display:none}#right{left:12px;right:12px;width:auto;top:auto;height:44vh}.tabs .tab span{display:none}.brand .s{display:none}}

/* Data-first workspaces: the 3D map is reserved for geographic and tracing modes */
body.data-view #stage,body.data-view #labels,body.data-view #left,body.data-view #right,body.data-view #dock,body.data-view #foot{display:none!important}
body.data-view #top .period{display:none}
body.data-view{background:#061222}
#workspace{display:none;position:fixed;inset:80px 12px 12px;z-index:8;overflow:auto;scrollbar-color:#29486d transparent;scrollbar-width:thin}
body.data-view #workspace{display:block}
.workspace-shell{max-width:1700px;margin:0 auto;padding:2px 3px 28px}
.ws-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:15px}
.ws-head h1{font-size:26px;line-height:1.3;margin:3px 0 7px;font-weight:900;letter-spacing:.3px}
.ws-head p{margin:0;font-size:12px;color:var(--muted);line-height:1.7}
.ws-eyebrow{color:#79d2ff;font-size:11px;font-weight:800;letter-spacing:1.6px}
.ws-source{display:flex;align-items:center;flex-wrap:wrap;gap:7px;justify-content:flex-end;max-width:440px}
.ws-source span{font-size:11px;padding:6px 10px;border-radius:8px;background:rgba(34,78,121,.25);border:1px solid var(--line);color:#b8d4ed}
.ws-toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:11px;padding:13px 15px;margin-bottom:14px}
.ws-field{display:flex;flex-direction:column;gap:5px;min-width:135px}
.ws-field label{color:var(--muted);font-size:11px;font-weight:700}
.ws-field select,.ws-field input{background:#0c2340;border:1px solid rgba(117,176,231,.33);border-radius:8px;min-height:37px;padding:7px 11px;color:var(--text);font-size:12px;outline:none}
.ws-field select:focus,.ws-field input:focus{border-color:#56b7ff;box-shadow:0 0 0 2px rgba(60,170,255,.13)}
.ws-actions{margin-left:auto;display:flex;gap:7px}
.ws-btn{border:1px solid var(--line2);border-radius:8px;background:rgba(40,109,166,.18);color:var(--text);padding:9px 11px;font-size:12px;font-weight:700;cursor:pointer}
.ws-btn:hover{background:rgba(43,128,197,.35)}
.ws-btn.active{background:#1973b1;border-color:#6fc8ff}
.ws-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.ws-kpi{padding:16px 17px;min-height:105px}
.ws-kpi .ws-k-label{font-size:12px;color:#9cbbd9;font-weight:600}
.ws-kpi .ws-k-val{font:800 29px/1.45 Inter,var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.8px;white-space:nowrap}
.ws-kpi .ws-k-foot{font-size:11px;color:#87accd;margin-top:3px}
.ws-kpi .ws-k-foot strong{color:#e6f5ff}
.ws-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr);gap:13px;margin-bottom:14px}
.ws-panel{padding:17px 18px;min-width:0}
.ws-panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.ws-panel h3{margin:0;font-size:15px;font-weight:800;letter-spacing:.2px}
.ws-muted{font-size:11px;color:var(--muted);line-height:1.7}
.ws-seg{display:flex;background:#06172c;border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.ws-seg button{border:0;color:#86b2d7;background:transparent;border-radius:6px;padding:7px 11px;cursor:pointer;font-size:11px;font-weight:700}
.ws-seg button.active{background:#205d90;color:#fff}
.ws-scroll-chart{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:#325c86 transparent;max-width:100%}
.ws-chart-legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:7px}
.ws-legend-dot{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:3px}
.ws-channel-row{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(55px,.5fr) minmax(85px,.7fr) 44px;gap:9px;align-items:center;margin:10px 0;font-size:12px}
.ws-track{height:8px;background:#122c4d;border-radius:9px;overflow:hidden}
.ws-track > i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#1489be,#4acafc)}
.ws-channel-amount{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.ws-channel-share{text-align:right;color:#95bad7;font-variant-numeric:tabular-nums}
.ws-section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px;gap:12px}
.ws-section-title h2{font-size:17px;margin:0}
.ws-year-card{overflow:hidden;margin-bottom:10px}
.ws-year-head{border:0;background:rgba(17,51,86,.6);color:var(--text);width:100%;display:grid;grid-template-columns:85px repeat(4,minmax(0,1fr)) 80px;align-items:center;gap:10px;text-align:right;padding:16px 16px;cursor:pointer}
.ws-year-head:hover{background:rgba(30,80,128,.7)}
.ws-year-head > span:first-child{text-align:left;font-size:16px;font-weight:900}
.ws-year-head .vl{display:block;color:#95b4cf;font-size:10px;margin-bottom:4px;font-weight:600}
.ws-year-head .vv{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.ws-year-head .ar{font-size:12px;color:#93d4ff;font-weight:700}
.ws-year-body{padding:10px 14px 14px;background:rgba(3,17,34,.4)}
.ws-data-table{border-collapse:collapse;width:100%;table-layout:auto;font-size:12px}
.ws-data-table th{font-size:11px;padding:10px 9px;text-align:right;color:#97b9d6;background:rgba(22,52,80,.65);white-space:nowrap}
.ws-data-table th:first-child{text-align:left}
.ws-data-table td{padding:11px 9px;text-align:right;border-bottom:1px solid rgba(120,190,255,.1);font-variant-numeric:tabular-nums;white-space:nowrap}
.ws-data-table td:first-child{text-align:left}
.ws-data-table tr[data-action]{cursor:pointer}
.ws-data-table tr[data-action]:hover td{background:rgba(60,170,255,.09)}
.ws-data-table tr.selected td{background:rgba(37,118,169,.24);color:#fff}
.ws-data-table .ws-tr-detail td{white-space:normal;text-align:left;padding:15px 12px;background:rgba(9,35,60,.82)}
.ws-month-detail{display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1fr);gap:20px}
.ws-month-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start}
.ws-mini-kpi{padding:11px;background:rgba(19,58,91,.65);border:1px solid var(--line);border-radius:8px}
.ws-mini-kpi .l{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.ws-mini-kpi b{font-size:18px}
.ws-note{border-left:3px solid #6ba8db;background:rgba(51,108,152,.11);padding:12px 16px;color:#bcd5ed;font-size:12px;line-height:1.85;border-radius:5px;margin-top:12px}
.ws-note strong{color:#effaff}
.ws-empty{padding:30px;color:var(--muted);text-align:center}
.ws-fin-chart{height:214px;display:flex;align-items:stretch;gap:7px;padding:10px 0 0}
.ws-fin-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;justify-content:flex-end}
.ws-fin-pair{display:flex;align-items:flex-end;justify-content:center;gap:5px;height:162px;width:100%;border-bottom:1px solid #426180}
.ws-fin-bar{width:30%;max-width:38px;min-height:2px;border-radius:5px 5px 0 0;transition:height .2s}
.ws-fin-bar.prev{background:#4277a4}.ws-fin-bar.now{background:#45c6f2}
.ws-fin-col > span{color:#a7c4df;font-size:10px;text-align:center;line-height:1.3}
.ws-donut-wrap{display:flex;align-items:center;justify-content:center;gap:13px;flex-wrap:wrap}
.ws-donut-leg{min-width:155px;flex:1}
.ws-donut-leg > div{font-size:12px;margin:11px 0;display:flex;justify-content:space-between;gap:8px}

const RAMP={
  rev:v=>new THREE.Color().setHSL(.56-.06*v,.85,.42+.22*v),
  wos:w=>new THREE.Color(w>12?0xe5484d:w>8?0xe8792f:w>4?0xe9b33a:0x2fbf71),
  ret:v=>new THREE.Color(v>7?0xe5484d:v>6?0xe8792f:v>5?0xe9b33a:0x2fbf71)
};
function applyMetric(){
  const data=allCounties(),max=Math.max(...data.map(d=>d.rev));
  for(const d of data){const I=ISL[d.id];let c,h,txt;
    if(S.metric==='rev'){const v=d.rev/max;c=RAMP.rev(v);h=6+v*70;txt=fmtW(d.rev);}
    else if(S.metric==='wos'){c=RAMP.wos(d.wos);h=4+d.wos*4.4;txt=d.wos+' 週';}
    else{c=RAMP.ret(d.ret);h=4+(d.ret-3)*12;txt=d.ret.toFixed(1)+'%';}

  renderLegend();

const WK_PLAT=[...CH,['Other','其他（簡訊、製作費等）']];

const wkMoney=n=>!Number.isFinite(n)?'—':Math.abs(n)>=1e8?(n/1e8).toFixed(2)+' 億':Math.abs(n)>=1e4?(n/1e4).toFixed(1)+' 萬':Math.round(n).toLocaleString('zh-TW');
const wkPct=n=>Number.isFinite(n)?n.toFixed(1)+'%':'—';
const wkRatio=(a,b)=>b?(a/b).toFixed(2)+'x':'—';
const wkDelta=(a,b)=>b?((a/b-1)*100).toFixed(1)+'%':'—';
const wkSum=(list,key)=>list.reduce((a,b)=>a+(Number(b[key])||0),0);
const wkOptions=(xs,v)=>xs.map(([id,name])=>`<option value="${id}" ${id===v?'selected':''}>${name}</option>`).join('');
const wkDate=(y,i)=>`${y}-${String(i+1).padStart(2,'0')}`;
const wkHtml=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const wkRowByKey=k=>{const [y,m]=k.split('-').map(Number);if(!MKT[y]||m<1||m>12)return null;const D=MKT[y],i=m-1;return {y:String(y),i,month:m,id:String(y)+'-'+i,key:k,spend:D.spend[i],rev:D.rev[i],target:D.target[i],fb:D.FB[i],Google:D.Google[i]};};
const wkIndex=k=>{const [y,m]=k.split('-').map(Number);return y*12+(m-1);};
const wkFromIndex=n=>`${Math.floor(n/12)}-${String(n%12+1).padStart(2,'0')}`;
const wkAllRows=()=>Object.keys(MKT).sort().flatMap(y=>Array.from({length:12},(_,i)=>wkRowByKey(wkDate(y,i))));
function wkRowsFor(f){
  return wkAllRows().filter(r=>{
    if(f.range==='custom')return r.key>=f.start&&r.key<=f.end;
    if(f.year!=='all'&&r.y!==f.year)return false;
    if(f.range==='all')return true;
    if(f.range==='h1')return r.month<=6;
    if(f.range==='h2')return r.month>=7;
    if(f.range==='month')return r.month===Number(f.month);
    if(f.range.startsWith('q'))return Math.ceil(r.month/3)===Number(f.range.slice(1));
    return true;
  });
}
function wkComparison(rows,f){
  if(f.cmp==='none')return {rows:[],label:'未啟用比較',valid:false};
  if(!rows.length)return {rows:[],label:'無選取資料',valid:false,reason:'請調整年度或期間。'};
  let keys=[],label='';
  if(f.cmp==='yoy'){
    keys=rows.map(r=>wkDate(Number(r.y)-1,r.i));label='去年同期';
  }else if(f.cmp==='prev'){
    const ordered=[...rows].sort((a,b)=>a.key.localeCompare(b.key));
    const first=wkIndex(ordered[0].key);
    const sequential=ordered.every((r,i)=>wkIndex(r.key)===first+i);
    if(!sequential)return {rows:[],label:'上一個等長期間',valid:false,reason:'此模式需要連續月份；請選單一年度或自訂連續區間。'};
    keys=Array.from({length:rows.length},(_,i)=>wkFromIndex(first-rows.length+i));label='上一個等長期間';
  }else if(f.cmp==='half'){
    if(f.year==='all'||(f.range!=='h1'&&f.range!=='h2'))return {rows:[],label:'同年另一個半年',valid:false,reason:'請先選定一個年度，並將期間設為「上半年」或「下半年」。'};
    keys=rows.map(r=>wkDate(Number(r.y),r.i+(f.range==='h1'?6:-6)));label=f.range==='h1'?'比較同年下半年（7–12 月）':'比較同年上半年（1–6 月）';
  }else if(f.cmp==='custom'){
    const a=wkIndex(f.cmpStart),b=wkIndex(f.cmpEnd);
    keys=Array.from({length:Math.max(0,b-a+1)},(_,i)=>wkFromIndex(a+i));label=`${f.cmpStart} ～ ${f.cmpEnd}`;
    if(keys.length!==rows.length)return {rows:[],label,valid:false,reason:'自訂比較區間月份數須與主要期間相同。'};
  }
  const crows=keys.map(wkRowByKey);
  return crows.every(Boolean)&&crows.length===rows.length?
    {rows:crows,label,valid:true}:{rows:[],label,valid:false,reason:'對照期間超出現有資料（2023–2025），不以推估值補齊。'};
}

function wkStat(rows){return {spend:wkSum(rows,'spend'),rev:wkSum(rows,'rev'),fb:wkSum(rows,'fb'),target:rows.reduce((a,r)=>a+(r.target||0),0)};}
function wkChannel(D,i,k){return k==='Other'?D.spend[i]-CH.reduce((a,c)=>a+D[c[0]][i],0):D[k][i];}
function wkSelectedSpend(rows){return rows.reduce((a,r)=>a+S.channels.reduce((b,k)=>b+wkChannel(MKT[r.y],r.i,k),0),0);}
function wkCard(label,value,foot){return `<div class="ws-kpi glass"><div class="ws-k-label">${label}</div><div class="ws-k-val">${value}</div><div class="ws-k-foot">${foot}</div></div>`;}
function wkComparisonHtml(rows,comp,extra=false){
  if(!comp.valid)return `<div class="ws-comparison"><h3>期間比較</h3><p class="ws-muted">${comp.reason||'尚未選擇比較模式'}${comp.label!=='未啟用比較'?'｜'+comp.label:''}</p></div>`;
  const a=wkStat(rows),b=wkStat(comp.rows),as=wkSelectedSpend(rows),bs=wkSelectedSpend(comp.rows);
  const cells=[['行銷總花費',a.spend,b.spend,'amount'],['總收益',a.rev,b.rev,'amount'],['營收／花費',a.rev/a.spend,b.rev/b.spend,'ratio'],[extra?'目標收益':'選取平台費用',extra?a.target:as,extra?b.target:bs,'amount']];
  return `<div class="ws-comparison"><h3>期間比較 <span class="ws-chip">${comp.label}</span></h3><div class="ws-comparison-grid">${cells.map(([name,n,p,fmt])=>{
    const diff=p?(n/p-1)*100:null,fmtFn=fmt==='ratio'?(v=>v.toFixed(2)+'x'):wkMoney;
    return `<div class="ws-comparison-cell"><div class="title">${name}</div><div class="values"><strong>${fmtFn(n)}</strong><span>對比 ${fmtFn(p)}</span></div><div class="delta ${diff===null?'':diff>=0?'positive':'negative'}">${diff===null?'基期為 0':`${diff>=0?'▲':'▼'} ${Math.abs(diff).toFixed(1)}%`}</div></div>`;
  }).join('')}</div><p class="ws-val-note">比較採相同長度的月份資料；比率以各期合計總收益 ÷ 合計行銷花費計算，不取月份比率平均值。選取平台費用僅為媒體支出，與營收歸因無直接對應。</p></div>`;
}
function wkFilterHtml(page){
  const f=S.filters[page];
  const yearOptions=[['all','全部年度'],...Object.keys(MKT).map(y=>[y,y+' 年'])];
  const rangeOptions=[['all','全年／全部月份'],['h1','上半年（1–6 月）'],['h2','下半年（7–12 月）'],['q1','第一季'],['q2','第二季'],['q3','第三季'],['q4','第四季'],['month','單一月份'],['custom','自訂起訖區間']];
  const cmpOptions=[['none','不比較'],['yoy','去年同期（YoY）'],['prev','上一個等長期間（MoM／前期）'],['half','同年上、下半年互比'],['custom','指定另一個區間']];
  const rows=wkRowsFor(f),c=wkComparison(rows,f);

  return `<section class="glass ws-toolbar ws-period-workspace" style="display:block" aria-label="資料時間與比較條件">
    <div class="ws-filter-heading"><span class="ws-step-no">01</span><div><strong>主要觀察期間</strong><small>先選年度，再選半年／季度／月份或自訂區間</small></div></div>

      ${f.range==='month'?`<div class="ws-field"><label>月份</label><select data-filter="month" data-page="${page}">${wkOptions(MONTHS.map((m,i)=>[String(i+1),m]),f.month)}</select></div>`:''}

      <span class="ws-range-preview">觀察期：${span}</span>

    <div class="ws-filter-divider"></div>
    <div class="ws-filter-heading"><span class="ws-step-no compare">02</span><div><strong>比較設定</strong><small>指定同期、前期、上下半年，或選擇另一段時間</small></div></div>
    <div class="ws-filters">
      <div class="ws-field"><label>比較模式</label><select data-filter="cmp" data-page="${page}">${wkOptions(cmpOptions,f.cmp)}</select></div>
      ${f.cmp==='custom'?`<div class="ws-field"><label>比較起始月份</label><input type="month" min="2023-01" max="2025-12" data-filter="cmpStart" data-page="${page}" value="${f.cmpStart}"></div><div class="ws-field"><label>比較結束月份</label><input type="month" min="2023-01" max="2025-12" data-filter="cmpEnd" data-page="${page}" value="${f.cmpEnd}"></div>`:''}
      <span class="ws-range-preview alt">比較期：${bspan}</span>
    </div>
    ${!c.valid&&f.cmp!=='none'?`<p class="ws-filter-warning">${wkHtml(c.reason||'目前無可比較資料。')}</p>`:''}
  </section>`;
}

function wkTrendSvg(rows,metric,compRows=[]){
 if(!rows.length)return '<div class="ws-empty">選取期間無資料</div>';
 const W=Math.max(800,rows.length*36),H=230,l=59,r=14,t=32,b=37,iw=W-l-r,ih=H-t-b;
 const getval=x=>metric==='roas'?x.rev/x.spend:x[metric];
 const vals=rows.map(getval),bases=compRows.length===rows.length?compRows.map(getval):[],maximum=Math.max(.001,...vals,...bases)*1.16;
 const x=i=>l+iw*(i+.5)/rows.length,y=v=>t+ih*(1-v/maximum);
 let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="月份趨勢與比較圖">`;
 for(let i=0;i<=4;i++){let v=maximum*i/4,py=y(v);g+=`<line x1="${l}" x2="${W-r}" y1="${py}" y2="${py}" stroke="#c8dfea"/><text x="${l-7}" y="${py+4}" text-anchor="end" font-size="10">${metric==='roas'?v.toFixed(1)+'x':v>=1e8?(v/1e8).toFixed(1)+'億':(v/1e6).toFixed(0)+'M'}</text>`;}
 const pts=vals.map((v,i)=>[x(i),y(v)]),points=pts.map(p=>p.join(',')).join(' ');
 g+=`<defs><linearGradient id="wk-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3698d0" stop-opacity=".24"/><stop offset="1" stop-color="#3698d0" stop-opacity="0"/></linearGradient></defs><polygon points="${pts[0][0]},${t+ih} ${points} ${pts.at(-1)[0]},${t+ih}" fill="url(#wk-grad)"/><polyline points="${points}" fill="none" stroke="#167bba" stroke-width="3.1"/>`;
 if(bases.length){const ps=bases.map((v,i)=>[x(i),y(v)]),str=ps.map(p=>p.join(',')).join(' ');
  g+=`<polyline points="${str}" fill="none" stroke="#d18b43" stroke-width="2.5" stroke-dasharray="7 5"/>`;
  g+=`<line x1="${W-242}" y1="14" x2="${W-215}" y2="14" stroke="#167bba" stroke-width="3"/><text x="${W-209}" y="18" fill="#4f718d" font-size="11">當期</text><line x1="${W-135}" y1="14" x2="${W-108}" y2="14" stroke="#d18b43" stroke-width="2.5" stroke-dasharray="5 3"/><text x="${W-102}" y="18" fill="#4f718d" font-size="11">比較期</text>`;
 }
 rows.forEach((row,i)=>{const [px,py]=pts[i];g+=`<circle cx="${px}" cy="${py}" r="3.3" fill="#126b9f"/>`;
  if(rows.length<=12||i%3===0||i===rows.length-1)g+=`<text x="${px}" y="${H-8}" font-size="10" text-anchor="middle">${row.y.slice(2)}/${row.month}</text>`;
  let content=`${row.y}/${row.month}：${metric==='roas'?wkRatio(row.rev,row.spend):wkMoney(vals[i])}`;
  if(bases.length)content+=`｜對照 ${compRows[i].y}/${compRows[i].month}：${metric==='roas'?wkRatio(compRows[i].rev,compRows[i].spend):wkMoney(bases[i])}`;
  g+=`<rect class="wk-trend-point" data-id="${row.id}" data-tip="${content}" x="${px-iw/rows.length*.46}" y="${t}" width="${iw/rows.length*.92}" height="${ih}" fill="transparent" style="cursor:pointer"/>`;
 });return g+'</svg>';
}

function wkChannelMetrics(rows,k){
 const whole=wkStat(rows),expense=rows.reduce((a,r)=>a+wkChannel(MKT[r.y],r.i,k),0),share=whole.spend?expense/whole.spend:0;
 const months=new Set(rows.map(r=>r.key));
 const caseRows=S.cases.filter(c=>!c.demo&&c.platform===k&&months.has(c.month)&&c.attributedRevenue!==null&&c.attributedRevenue!==''&&Number.isFinite(Number(c.attributedRevenue)));
 const attributed=caseRows.length?caseRows.reduce((a,c)=>a+Number(c.attributedRevenue),0):null;
 const caseSpend=caseRows.reduce((a,c)=>a+Number(c.spend||0),0);
 return {expense,share,estimate:whole.rev*share,attributed,caseSpend,caseCount:caseRows.length,caseRoas:attributed!==null&&caseSpend>0?attributed/caseSpend:null};
}
function wkSpendSegments(rows){
 const total=wkStat(rows).spend;
 let p=0;
 return WK_PLAT.map(([k,n],idx)=>{const expense=rows.reduce((a,r)=>a+wkChannel(MKT[r.y],r.i,k),0);
  const share=total?Math.max(0,expense/total):0,from=p;p+=share;
  return {k,n,expense,share,from,to:p,color:WK_COLORS[idx],enabled:S.channels.includes(k)};
 });
}
function wkSpendGradient(rows){
 const segs=wkSpendSegments(rows);return 'conic-gradient('+segs.map(s=>`${s.color} ${(s.from*100).toFixed(4)}% ${(s.to*100).toFixed(4)}%`).join(',')+')';
}
function wkSpendingDonut(rows,small=false){
 const parts=wkSpendSegments(rows),total=wkStat(rows).spend,R=small?34:82,stroke=small?16:33,cx=small?44:110,cy=cx,perimeter=2*Math.PI*R;
 let svg=`<svg class="wk-donut-svg" viewBox="0 0 ${cx*2} ${cy*2}" role="img" aria-label="平台投放費用構成圖">`;
 parts.forEach(p=>{
  const focus=S.channelFocus===p.k,opacity=p.enabled?(S.channelFocus&&!focus?.50:1):.2;
  svg+=`<circle data-action="focus-channel" data-channel="${p.k}" tabindex="0" role="button" aria-label="檢視 ${wkHtml(p.n)}，${wkMoney(p.expense)}，占比 ${(p.share*100).toFixed(1)}%" cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${p.color}" stroke-width="${focus?stroke+3:stroke}" stroke-dasharray="${(p.share*perimeter).toFixed(4)} ${(perimeter-p.share*perimeter).toFixed(4)}" stroke-dashoffset="${(-p.from*perimeter).toFixed(4)}" stroke-opacity="${opacity}" transform="rotate(-90 ${cx} ${cy})" style="cursor:pointer;outline-offset:2px"><title>${wkHtml(p.n)}｜${wkMoney(p.expense)}｜${wkPct(p.share*100)}</title></circle>`;
 });
 svg+=`<text x="${cx}" y="${cy-5}" text-anchor="middle" class="wk-donut-center-label">${small?'全年':'總投放費用'}</text><text x="${cx}" y="${cy+18}" text-anchor="middle" class="wk-donut-center-num">${small?wkMoney(totalForYear(rows)):wkMoney(wkStat(rows).spend)}</text></svg>`;
 return svg;
}

/* v21 — single source of truth for active section. The workspace div, not window, scrolls. */
function ob21SyncNav(){
 const scroll=document.querySelector('#workspace'),holder=document.querySelector('#workspaceBody');
 if(!scroll||!holder||!document.body.classList.contains('data-view'))return;
 const nav=holder.querySelector('.wk-float-nav');if(!nav)return;
 const buttons=Array.from(nav.querySelectorAll('[data-action="scroll-to"]'));
 const border=scroll.getBoundingClientRect().top+Math.min(125,scroll.clientHeight*.2);
 let active=0;
 buttons.forEach((b,i)=>{const el=document.getElementById(b.dataset.target);if(el&&el.getBoundingClientRect().top<=border)active=i;});
 if(scroll.scrollTop+scroll.clientHeight>=scroll.scrollHeight-18)active=buttons.length-1;
 buttons.forEach((b,i)=>{
   const on=i===active;b.classList.toggle('active',on);
   if(on)b.setAttribute('aria-current','location');else b.removeAttribute('aria-current');
 });
 nav.style.setProperty('--nav-progress',buttons.length>1?((active/(buttons.length-1))*100).toFixed(1)+'%':'0%');
}
function ob21CloseFilterPopups(event){
 const pane=document.querySelector('#workspaceBody');if(!pane)return;
 const inside=event.target?.closest?.('details.ws-multi');
 pane.querySelectorAll('details.ws-multi[open]').forEach(detail=>{
   if(detail!==inside){detail.open=false;
     if(detail.id==='finMulti')S.finFilterOpen=false;
     if(detail.id==='opRegionMulti')S.opRegionOpen=false;
     if(detail.id==='opCountyMulti')S.opCountyOpen=false;
   }
 });
}
let ob21PopupEventsBound=false;
function ob21BindWorkspaceUI(){
 const scroll=document.querySelector('#workspace');if(!scroll)return;
 if(!scroll.dataset.ob21ScrollBound){
   scroll.addEventListener('scroll',()=>{
     if(scroll.__ob21Raf)return;
     scroll.__ob21Raf=requestAnimationFrame(()=>{scroll.__ob21Raf=0;ob21SyncNav();});
   },{passive:true});
   scroll.dataset.ob21ScrollBound='yes';
 }
 if(!ob21PopupEventsBound){
   document.addEventListener('pointerdown',ob21CloseFilterPopups,true);
   document.addEventListener('keydown',e=>{
     if(e.key==='Escape'){
       ob21CloseFilterPopups({target:null});
       if(document.activeElement?.matches('details.ws-multi summary'))document.activeElement.blur();
     }
   });
   ob21PopupEventsBound=true;
 }
 requestAnimationFrame(ob21SyncNav);
}
function ob21Trend(cur,base){
 const a=Number(cur)||0,b=Number(base)||0;
 if(!b)return `<span class="ob21-trend no-base" title="比較基期無數據">${a?'＋ 新增':'—'}</span>`;
 const pct=(a/b-1)*100,steady=Math.abs(pct)<.5;
 const direction=steady?'flat':pct>0?'up':'down';
 const label=steady?'→ 持平':pct>0?'↑ 上升':'↓ 下降';
 return `<span class="ob21-trend ${direction}" title="相較前一年：${pct>=0?'+':''}${pct.toFixed(1)}%">${label} ${steady?'':(pct>=0?'+':'')+pct.toFixed(1)+'%'}</span>`;
}

function wkMarketingAI(rows){
 const stat=wkStat(rows), sel=wkSelectedSpend(rows), avg=rows.length?sel/rows.length:0;
 const shares=WK_PLAT.filter(([k])=>S.channels.includes(k)).map(([k,n])=>({k,n,spend:rows.reduce((a,r)=>a+wkChannel(MKT[r.y],r.i,k),0)})).sort((a,b)=>b.spend-a.spend);
 const top=shares[0], second=shares[1];
 const topShare=sel&&top?top.spend/sel*100:0;
 const ratio=stat.spend?stat.rev/stat.spend:0;
 const notes=[];
 if(top&&topShare>45) notes.push(`目前已選平台費用高度集中在 ${top.n}（約 ${wkPct(topShare)}），建議以創意、受眾與再行銷拆分做 A/B 測試，避免單一平台波動影響整體投放效率。`);
 if(top&&second) notes.push(`費用前兩大平台為 ${top.n} 與 ${second.n}，建議固定建立「平台別費用、點擊、CTR、轉換」月報，以便未來從費用占比升級到成效占比。`);
 if(ratio<2.2) notes.push(`目前全公司「總收益／行銷花費」約 ${wkRatio(stat.rev,stat.spend)}，偏低。建議優先檢查高成本月份與素材疲乏，並針對高花費平台建立停損閾值。`);
 else notes.push(`目前全公司「總收益／行銷花費」約 ${wkRatio(stat.rev,stat.spend)}。下一步應補平台歸因營收、點擊與轉單資料，才能區分「花得多」與「投得準」。`);
 if(avg>0) notes.push(`已選平台平均每月投入約 ${wkMoney(avg)}。建議將年度預算拆成月度配速表，並把旺季／淡季、活動檔期與新品節奏納入調整。`);
 return `<section class="ws-panel glass" id="mkt-ai"><div class="ws-panel-head"><div><h3>AI 建議｜行銷投放</h3><p class="ws-muted">規則式分析建議示意（尚未串接 LLM）；依目前期間與已選平台計算</p></div><span class="ws-chip">AI Suggestion</span></div><div class="wk-ai-list">${notes.map((t,i)=>`<div class="wk-ai-item"><b>建議 ${i+1}</b><p>${t}</p></div>`).join('')}</div></section>`;
}
function wkFinanceAI(c,p,release,totalRelease,monthsCover){
 const debtRatio=c.assets?c.liab/c.assets*100:0, invShare=c.assets?c.inv/c.assets*100:0, arShare=c.assets?c.ar/c.assets*100:0;
 const notes=[];
 if(invShare>25) notes.push(`存貨占資產約 ${wkPct(invShare)}，偏高。建議優先切庫齡、周轉天數與滯銷 SKU，將「降庫存」拆成促銷出清、補貨節奏與新品配比三條線執行。`);
 if(arShare>10) notes.push(`應收帳款占資產約 ${wkPct(arShare)}。建議建立帳齡分層與催收節點，區分大客戶、通路客戶與異常逾期名單。`);
 if(totalRelease>0) notes.push(`在目前情境下，可望釋放約 ${wkMoney(totalRelease)} 營運資金，現金水位可由 ${wkMoney(c.cash)} 提升至 ${wkMoney(c.cash+totalRelease)}，約可支應 ${monthsCover.toFixed(1)} 個月平均行銷費。`);
 if(debtRatio>55) notes.push(`負債比率約 ${wkPct(debtRatio)}，資金壓力仍在。若釋放資金後要提高安全性，建議優先補充現金緩衝而非立即擴大固定支出。`);
 notes.push(`正式版建議下一步：接入月損益、現金流量表、應收帳齡、存貨庫齡與採購／付款條件，才能把本頁從「結構觀察」提升到「現金管理決策」。`);
 return `<section class="ws-panel glass" id="fin-ai"><div class="ws-panel-head"><div><h3>AI 建議｜財務體質與營運資金</h3><p class="ws-muted">規則式分析建議示意（尚未串接 LLM）；依結構比率與情境試算產出</p></div><span class="ws-chip">AI Suggestion</span></div><div class="wk-ai-list">${notes.map((t,i)=>`<div class="wk-ai-item"><b>建議 ${i+1}</b><p>${t}</p></div>`).join('')}</div></section>`;
}

function wkCountyStats(rows){
 const ret=GEO.map(g=>({id:g.id,name:g.name,rev:0,orders:0,wos:0,returnRate:0}));
 for(const r of rows){const d=GEO.map(g=>county(g.id,r.y,r.i)),sum=d.reduce((a,v)=>a+v.rev,0),norm=sum?r.rev/sum:0;
   d.forEach((v,i)=>{ret[i].rev+=v.rev*norm;ret[i].orders+=Math.round(v.orders*norm);ret[i].wos+=v.wos;ret[i].returnRate+=v.ret;});
 }
 ret.forEach(x=>{x.wos=rows.length?x.wos/rows.length:0;x.returnRate=rows.length?x.returnRate/rows.length:0;});return ret.sort((a,b)=>b.rev-a.rev);
}

function wkNumChange(now,base){
 if(!Number.isFinite(now)||!Number.isFinite(base))return '—';
 if(base===0)return now===0?'0.0%':'基期為 0';
 const v=(now/base-1)*100;return `<span class="${v>=0?'ws-diff-up':'ws-diff-down'}">${v>=0?'+':''}${v.toFixed(1)}%</span>`;
}

const OB_CH = [
  {id:'ec',name:'官網 EC',color:'#527cae',weight:.39},

function obChMonth(row){
 // Month- and year-varying weights, reproducible with the same filters. Every month reconciles to company revenue.
 const month=Number(row.month),year=Number(row.y);
 const shifts=[
  1+.10*Math.sin(month*.65+year*.31),
  1+.12*Math.cos(month*.58+year*.39),
  1+.10*Math.sin(month*.83+year*.11),
  1+.16*Math.sin(month*.44+year*.71),
  1+.09*Math.cos(month*.72+year*.61)
 ];
 const weighted=OB_CH.map((c,i)=>c.weight*shifts[i]);const sum=weighted.reduce((a,b)=>a+b,0);
 return Object.fromEntries(OB_CH.map((c,i)=>[c.id,row.rev*weighted[i]/sum]));
}
function obChPeriod(rows){
 const out=Object.fromEntries(OB_CH.map(c=>[c.id,0]));
 for(const row of rows){const vals=obChMonth(row);for(const c of OB_CH)out[c.id]+=vals[c.id];}
 return out;
}

 <p class="ws-val-note">圓餅圖與長條圖共用相同月份的模擬通路拆分，合計回到原始全公司營收。點選通路可聚焦右側月度長條；有有效比較期時會顯示同期增減。此處非真實 POS／EC 通路歸因。</p>`;

function obChannelMonthlyChart(rows,comp){

 const items=rows.map((r,i)=>({r,cur:obChMonth(r),old:good?obChMonth(comp.rows[i]):null,oldRow:good?comp.rows[i]:null}));
 const peak=Math.max(1,...items.flatMap(x=>[x.r.rev,x.oldRow?x.oldRow.rev:0]))*1.15;
 const plotH=242,top=16,bottom=plotH+top,slot=good?96:78,left=62,right=24,w=Math.max(900,left+right+items.length*slot),h=338;
 const sy=v=>bottom-v/peak*plotH;
 function bar(values,total,x,width,light,caption){
   let y=bottom;const segments=OB_CH.map(ch=>{const v=values[ch.id],bh=(v/peak)*plotH;y-=bh;const active=selected==='all'||selected===ch.id;return `<rect x="${x}" y="${y}" width="${width}" height="${Math.max(0,bh)}" rx="0" fill="${ch.color}" opacity="${light?(active?.47:.12):(active?1:.12)}"><title>${caption}｜${ch.name}：${wkMoney(v)}｜占比 ${total?wkPct(v/total*100):'—'}</title></rect>`;}).join('');
   return segments+`<rect x="${x}" y="${sy(total)}" width="${width}" height="${bottom-sy(total)}" fill="transparent"><title>${caption} 合計：${wkMoney(total)}</title></rect>`;
 }
 let bars='';
 items.forEach(({r,cur,old,oldRow},i)=>{const x=left+i*slot+(good?14:19),ww=good?25:39;
   bars+=bar(cur,r.rev,x,ww,false,`${r.y}/${r.month} 觀察期`);
   if(good)bars+=bar(old,oldRow.rev,x+31,ww,true,`${oldRow.y}/${oldRow.month} 比較期`);
   bars+=`<text x="${x+(good?28:19)}" y="${bottom+20}" text-anchor="middle" font-size="13" fill="#4c667a">${r.y}/${String(r.month).padStart(2,'0')}</text>`;
 });
 const marks=[0,.25,.5,.75,1].map(x=>`<g><line x1="${left}" y1="${sy(peak*x)}" x2="${w-right}" y2="${sy(peak*x)}" stroke="#dfe6ea" stroke-dasharray="4 5"/><text x="${left-10}" y="${sy(peak*x)+5}" text-anchor="end" font-size="13" fill="#678093">${(peak*x/1e8).toFixed(1)}億</text></g>`).join('');
 const showTotal=items.reduce((sum,x)=>sum+x.r.rev,0);
 const focused=selected==='all'?showTotal:items.reduce((sum,x)=>sum+x.cur[selected],0);
 const channel=OB_CH.find(c=>c.id===selected);
 const legend=`<div class="ob-legend ob-channel-legend">${OB_CH.map(c=>`<span style="opacity:${selected==='all'||selected===c.id?'1':'.5'}"><i style="background:${c.color}"></i>${c.name}</span>`).join('')}</div>`;
 return `<div class="ob-channel-chart-summary"><span>${channel?`已聚焦：${channel.name}`:'全部通路'}｜期間營收 <strong>${wkMoney(focused)}</strong></span><span>${good?'深色：觀察期；淡色：比較期':'深色：觀察期｜啟用同期比較可新增並排長條'}</span></div><div class="ob-channel-svg-scroll"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="每月通路營收堆疊長條圖，含同期比較">${marks}${bars}</svg></div>${legend}
 <details class="ob-channel-details"><summary>查看逐月通路營收數值（${rows.length} 個月份）</summary><div class="ws-table-wrap"><table class="ws-data-table"><thead><tr><th>月份</th>${OB_CH.map(c=>`<th>${c.name}</th>`).join('')}<th>合計</th>${good?'<th>比較期營收</th><th>增減率</th>':''}</tr></thead><tbody>${items.map(({r,cur,oldRow})=>`<tr><td>${r.y}/${String(r.month).padStart(2,'0')}</td>${OB_CH.map(c=>`<td>${wkMoney(cur[c.id])}</td>`).join('')}<td><strong>${wkMoney(r.rev)}</strong></td>${good?`<td>${wkMoney(oldRow.rev)}</td><td>${wkDelta(r.rev,oldRow.rev)}</td>`:''}</tr>`).join('')}</tbody></table></div></details>
 <p class="ws-val-note">逐月營收分拆是示意估算，通路合計等於原始月份營收；比較期使用目前篩選設定所對應的等長期間。沒有原始通路／單店銷售資料時，不能據此評估真實門市績效。</p>`;

 });

function v17ChannelDonut(rows,stat,comp){
 const vals=obChPeriod(rows),total=stat.rev||1,prior=comp.valid?obChPeriod(comp.rows):null;
 let at=0;const grad='conic-gradient('+OB_CH.map(ch=>{const from=at;at+=vals[ch.id]/total*100;return `${ch.color} ${from.toFixed(2)}% ${at.toFixed(2)}%`}).join(',')+')';
 const focus=S.opsChannelFocus||'all';
 return `<section class="v17-panel" id="ops-channel-pie"><div class="v17-panel-head"><div><div class="v17-overline">02 / CHANNEL MIX</div><h3>通路營收占比</h3><p>圓餅圖回答「營收來自哪裡」</p></div><span class="v17-source-tag demo">通路示意</span></div><div class="v17-donut-layout"><div class="v17-donut" style="background:${grad}"><div><small>觀察期總營收</small><strong>${wkMoney(stat.rev)}</strong><small>100%</small></div></div><div class="v17-donut-legend">${OB_CH.map(ch=>{const amount=vals[ch.id],prev=prior?prior[ch.id]:null;return `<button type="button" data-action="ops-channel" data-channel="${ch.id}" class="${focus===ch.id?'active':''}" title="聚焦 ${ch.name}"><i style="background:${ch.color}"></i><b>${ch.name}</b><strong>${wkPct(amount/total*100)}</strong><span>${wkMoney(amount)}</span>${prior&&prev>0?`<small class="${amount>=prev?'v17-positive':'v17-negative'}">同期 ${wkDelta(amount,prev)}</small>`:''}</button>`;}).join('')}<button class="v17-reset" type="button" data-action="ops-channel" data-channel="all">查看全部通路</button></div></div><p class="v17-caption">點選通路可同步聚焦右側逐月圖；圓餅圖始終以觀察期計算占比。</p></section>`;
}
function v17ChannelsMonthly(rows,comp){
 const focus=S.opsChannelFocus||'all',good=comp.valid&&comp.rows.length===rows.length;
 const items=rows.map((r,i)=>({r,v:obChMonth(r),p:good?obChMonth(comp.rows[i]):null,prev:good?comp.rows[i]:null}));
 const peak=Math.max(1,...items.flatMap(x=>[x.r.rev,x.prev?x.prev.rev:0]))*1.18,slot=good?85:68;
 const w=Math.max(740,70+items.length*slot+24),h=300,L=65,R=20,T=25,B=57,base=h-B,H=base-T,yy=v=>base-v/peak*H;
 const ticks=[0,.25,.5,.75,1].map(t=>{const y=yy(peak*t);return `<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="#e3eaf0" stroke-dasharray="5 6"/><text x="${L-9}" y="${y+4}" text-anchor="end" fill="#728496" font-size="14">${(peak*t/1e8).toFixed(1)}億</text>`;}).join('');
 function stack(values,x,bw,old){let cumulative=0;return OB_CH.map(ch=>{const v=values[ch.id]||0,y=yy(cumulative+v),h=Math.max(0,(v/peak)*H);cumulative+=v;return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${ch.color}" opacity="${old?(focus==='all'||ch.id===focus?.46:.13):(focus==='all'||ch.id===focus?1:.14)}"><title>${ch.name} ${wkMoney(v)}</title></rect>`;}).join('');}
 const bars=items.map(({r,v,p,prev},i)=>{const x=L+i*slot+11,bw=good?27:38;return `<g>${stack(v,x,bw,false)}${good?stack(p,x+bw+4,bw,true):''}<text x="${x+(good?bw+2:bw/2)}" y="${base+23}" text-anchor="middle" fill="#60788e" font-size="13">${rows.length>12?`${r.y}/`:''}${String(r.month).padStart(2,'0')}月</text></g>`;}).join('');
 const vSum=focus==='all'?wkStat(rows).rev:items.reduce((a,x)=>a+x.v[focus],0);
 const label=OB_CH.find(c=>c.id===focus)?.name||'全部通路';
 return `<section class="v17-panel" id="ops-channel-month"><div class="v17-panel-head"><div><div class="v17-overline">03 / MONTHLY CHANNEL TREND</div><h3>各通路逐月營收</h3><p>每一根長條都是當月通路營收構成</p></div><span class="v17-source-tag demo">通路示意</span></div><div class="v17-channel-summary"><b>${label}</b>　${wkMoney(vSum)} <span>${good?'深色是觀察期／淡色是比較期':'開啟比較後可看到同期長條'}</span></div>
 <div class="v17-svg-scroll"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="各通路逐月營收堆疊長條圖">${ticks}${bars}</svg></div><div class="v17-legend">${OB_CH.map(c=>`<span style="opacity:${focus==='all'||focus===c.id?1:.45}"><i style="background:${c.color}"></i>${c.name}</span>`).join('')}</div><p class="v17-caption">選通路會淡化其他通路；每月加總仍等於當月總營收。與左側圓餅圖使用相同的示意拆分。</p></section>`;
}

function wkFinStructureCircle(items,total,title){
 let p=0;const gradient='conic-gradient('+items.map((a,i)=>{const start=p;p+=Math.max(0,a.value)/Math.max(1,total)*100;return `${a.color} ${start.toFixed(3)}% ${Math.min(100,p).toFixed(3)}%`;}).join(',')+')';
 return `<div class="wk-fin-ring-layout"><div class="wk-fin-ring" style="background:${gradient}"><div><small>${title}</small><b>${wkMoney(total)}</b></div></div><div class="wk-fin-ring-legend">${items.map(a=>`<div><i class="wk-color" style="background:${a.color}"></i><span>${a.name}</span><b>${wkPct(a.value/Math.max(1,total)*100)}</b></div>`).join('')}</div></div>`;
}
function wkFinDoubleStructure(){

function wkFinRatioPanel(){

const OB20_STATE={mode:'balanced',yr:2026,month:1,year2026:100,year2027:103,transfer:12,threshold:2.0,risk:60,showGroup:'all',evidence:{},prior:Object.fromEntries(OB20_CHANNELS.map(c=>[c.id,c.prior])),scenarioNonce:0};
const ob20Fmt=ob19Money;

function ob20FmtRatio(v){return Number.isFinite(v)?v.toFixed(2)+'x':'—';}
function ob20YearCosts(y){const raw=OB19_RAW[String(y)],groups=Object.fromEntries(OB20_CHANNELS.map(c=>[c.id,0]));raw.items.forEach(x=>{groups[OB19_GROUP_MAP[x.name]||'其他 / 待分類']+=x.months.reduce((s,v)=>s+(Number(v)||0),0);});return groups;}
function ob20MonthCosts(m){const raw=OB19_RAW['2025'],groups=Object.fromEntries(OB20_CHANNELS.map(c=>[c.id,0]));raw.items.forEach(x=>{groups[OB19_GROUP_MAP[x.name]||'其他 / 待分類']+=Number(x.months[m])||0;});return groups;}
function ob20Evidence(id,year,month){const out=[];for(const [key,val] of Object.entries(OB20_STATE.evidence)){const [yy,mm,...rest]=key.split('|');if(rest.join('|')!==id)continue;if(Number(yy)<year||(Number(yy)===year&&Number(mm)<month))out.push(val)}return out;}
function ob20Estimate(c,y,m){const values=ob20Evidence(c.id,y,m), prior=Number(OB20_STATE.prior[c.id]??c.prior), actual=values.filter(Number.isFinite);const mean=(prior*3+actual.reduce((a,b)=>a+b,0))/(3+actual.length);const volatility=c.sigma/Math.sqrt(1+actual.length/2);return {mean,sigma:volatility,n:actual.length};}
function ob20Scenario(){return {conservative:0.7,balanced:1,aggressive:1.45}[OB20_STATE.mode]||1;}
function ob20Calc(){
 const results=[],pre=OB19_RAW['2025'], intensity=ob20Scenario(),maxShift=OB20_STATE.transfer/100*intensity, risk=OB20_STATE.risk/100;
 for(const y of [2026,2027])for(let m=1;m<=12;m++){
  const base=Number(pre.spend[m-1])||0,annual2026=OB20_STATE.year2026/100, annual2027=OB20_STATE.year2027/100;
  const budget=base*annual2026*(y===2027?annual2027:1);
  const cost=ob20MonthCosts(m-1),sum=Object.values(cost).reduce((a,b)=>a+b,0);
  const sourceShares=OB20_CHANNELS.map(c=>sum>0?cost[c.id]/sum:(c.mode==='adjustable'?0.2:0));
  const sharesSum=sourceShares.reduce((a,b)=>a+b,0)||1;
  const lines=OB20_CHANNELS.map((c,i)=>{
    const original=budget*sourceShares[i]/sharesSum;
    const prediction=ob20Estimate(c,y,m);
    const score=c.mode==='adjustable'?prediction.mean*(1-risk*prediction.sigma):null;
    return {...c,baseline:original,planned:original,forecast:prediction,score,action:'維持',shift:0};
  });
  const candidates=lines.filter(c=>c.mode==='adjustable');
  const low=[...candidates].sort((a,b)=>(a.score||0)-(b.score||0));
  const high=[...candidates].sort((a,b)=>(b.score||0)-(a.score||0));
  // Controlled same-month transfer. Never pretend future outcomes are observed.
  const transferable=budget*maxShift;
  let left=transferable;
  for(const c of low){if(left<=1)break;const p=OB20_STATE.threshold;const below=c.score<p;
    const count=c.forecast.n;
    if(!below&&c.score>=p+0.35)continue;
    const factor=(below?0.30:0.12)*intensity;
    const cut=Math.min(c.planned*(count>=2?Math.min(.6,factor*1.7):factor),left);
    c.planned-=cut;left-=cut;
  }
  const freed=transferable-left;
  // If no qualifying winner, return any simulated cuts to their owners: preserve total spend.
  const winners=high.filter(c=>c.score>=OB20_STATE.threshold+0.1).slice(0,3);
  const weights=winners.map(c=>Math.max(0,c.score-OB20_STATE.threshold)),wsum=weights.reduce((a,b)=>a+b,0)||1;
  if(winners.length && wsum>0){winners.forEach((c,i)=>c.planned+=freed*weights[i]/wsum);}
  else{for(const c of lines)c.planned=c.baseline;}
  for(const c of lines){
    c.shift=c.planned-c.baseline;
    if(c.mode!=='adjustable')c.action='固定／觀察';
    else if(c.forecast.n>=2&&c.score<OB20_STATE.threshold) c.action='建議暫停評估';
    else if(c.shift>1000)c.action='建議加碼';
    else if(c.shift<-1000)c.action='建議減碼';
    else if(c.score<OB20_STATE.threshold)c.action='列入觀察';
    else c.action='維持／測試';
  }
  const baselineValue=lines.filter(c=>c.mode==='adjustable').reduce((a,c)=>a+c.baseline*c.forecast.mean,0);
  const predictedValue=lines.filter(c=>c.mode==='adjustable').reduce((a,c)=>a+(c.baseline>0?c.planned*c.forecast.mean*Math.pow(Math.max(.001,c.planned/c.baseline),-.18):0),0);
  const actualBudget=lines.reduce((a,c)=>a+c.planned,0);
  const estimatedRange=0.25+0.15*risk;
  results.push({y,m,budget:actualBudget,baselineValue,predictedValue,lower:predictedValue*(1-estimatedRange),upper:predictedValue*(1+estimatedRange),lines,freed});
 }
 return results;
}

  }else{
    h+=`<h5>逆向溯源鏈：顧客 → 門市 → 倉儲 → 工廠 → 原物料</h5><div id="steps">
     ${CASE.back.map((s,i)=>`<div class="step ${i===traceStep?'on':i<traceStep?'done':''}" data-i="${i}"><div class="dot">${s.ic}</div><div class="bx">
       <div class="t1">${s.t}<span class="sys">${s.sys}</span></div>
       <div class="t2"><code>${s.id}</code><br>${s.when}｜${nm(s.loc)}<br>${s.d}</div></div></div>`).join('')}</div>
     <div class="row2"><button class="btn" id="prev">◀ 上一站</button><button class="btn pri" id="next">下一站 ▶</button><button class="btn warm" id="toImp">看同批號影響範圍 →</button></div>
     <div class="insight" style="margin-top:10px"><b>根因線索</b>：產線 L3 壓膠站溫度異常 2 次、出貨水壓測試僅抽 5 件、膠條批號 TAPE-0716。三個訊號同時指向<b>接縫壓膠製程</b>，而非門市保管或顧客使用。</div>`;
  }
  h+=`   <details style="margin-top:14px"><summary style="cursor:pointer;font-size:12px;color:var(--muted);font-weight:700">消費歷史 6 筆（展開）<span class="sys" style="margin-left:6px">POS／EC／LINE</span></summary>
   <table><thead><tr><th>日期</th><th>通路／商品</th><th>金額</th><th>狀態</th></tr></thead><tbody>
   ${CASE.history.map((r,i)=>`<tr${i===0?' style="background:rgba(255,204,102,.08)"':''}><td class="num">${r[0].slice(2)}</td><td>${r[3]}<div style="font-size:10px;color:var(--dim)">${r[2]}｜<code style="font-size:10px">${r[1]}</code></div></td><td class="num">${r[4].toLocaleString()}</td><td style="color:${r[5]==='退貨中'?'#ffcc66':'var(--muted)'}">${r[5]}</td></tr>`).join('')}</tbody></table></details>`;
  h+=`<div class="note">情境為示意個案，用來驗證資料串接需求：會員 ID（CRM）↔ 訂單（POS／EC）↔ 序號／批號（WMS）↔ 工單（MES／PLM）↔ 原物料批號（SRM）。任何一段缺少共同鍵值，溯源就會在該站中斷。</div>`;
  bd.innerHTML=h;
  $('#bBack').onclick=()=>runTrace('back');$('#bImp').onclick=()=>runTrace('impact');
  bd.querySelectorAll('.step').forEach(el=>el.onclick=()=>focusStep(+el.dataset.i));
  const nx=$('#next');if(nx){nx.onclick=()=>focusStep(Math.min(CASE.back.length-1,traceStep+1));$('#prev').onclick=()=>focusStep(Math.max(0,traceStep-1));$('#toImp').onclick=()=>runTrace('impact');}
  bd.querySelectorAll('[data-fly]').forEach(r=>r.onclick=()=>{const id=r.dataset.fly;flyTo(ISL[id].anchor,200,.8,0);});
}

/* ---------- charts (SVG, single axis, hover tooltips) ---------- */
const tip=$('#tip');
function showTip(e,html){tip.innerHTML=html;tip.style.display='block';const x=Math.min(innerWidth-270,e.clientX+14),y=e.clientY+14;tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.style.display='none';}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function barChart(el,labels,series,opt={}){
  const W=el.clientWidth||360,H=opt.h||140,pl=36,pr=6,pt=8,pb=20,iw=W-pl-pr,ih=H-pt-pb;
  const max=niceMax(Math.max(...series.flatMap(s=>s.vals))*1.05),min=0;
  const n=labels.length,gw=iw/n,bw=Math.min(18,(gw-6)/series.length-2);
  const fmt=series[0].fmt||(v=>fmtW(v));
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  for(let k=0;k<=3;k++){const v=min+(max-min)*k/3,y=pt+ih-ih*k/3;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="rgba(150,190,240,.12)"/><text x="${pl-5}" y="${y+3}" fill="#6a86a6" font-size="9" text-anchor="end">${series[0].fmt?(+v.toFixed(1)):v>=1e8?(v/1e8).toFixed(1)+'億':(v/1e6).toFixed(0)+'M'}</text>`;}
  labels.forEach((l,i)=>{const gx=pl+gw*i;
    series.forEach((se,j)=>{const v=se.vals[i],h=ih*(v-min)/(max-min),x=gx+(gw-(bw+2)*series.length)/2+j*(bw+2),y=pt+ih-h;
      const op=opt.hi!==undefined&&opt.hi!==i?.45:1;
      s+=`<path d="M${x},${pt+ih} V${y+3} Q${x},${y} ${x+3},${y} H${x+bw-3} Q${x+bw},${y} ${x+bw},${y+3} V${pt+ih}Z" fill="${se.color}" opacity="${op}"/>`;});
    s+=`<rect x="${gx}" y="${pt}" width="${gw}" height="${ih}" fill="transparent" data-i="${i}"/>`;
    s+=`<text x="${gx+gw/2}" y="${H-6}" fill="${opt.hi===i?'#eaf4ff':'#6a86a6'}" font-size="9.5" text-anchor="middle" font-weight="${opt.hi===i?700:400}">${l}</text>`;});
  s+=`</svg>`;
  if(series.length>1)s=`<div style="display:flex;gap:12px;font-size:11px;color:var(--muted);margin-bottom:4px">${series.map(se=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${se.color};margin-right:4px;vertical-align:-1px"></i>${se.name}</span>`).join('')}</div>`+s;
  el.innerHTML=s;
  el.querySelectorAll('rect[data-i]').forEach(r=>{const i=+r.dataset.i;r.onmousemove=e=>showTip(e,`<b>${labels[i]}</b><br>${series.map(se=>`${se.name}：<b class="num">${(se.fmt||fmt)(se.vals[i])}</b>`).join('<br>')}${opt.extra?opt.extra(i):''}`);r.onmouseleave=hideTip;
    if(opt.click)r.onclick=()=>opt.click(i);r.style.cursor=opt.click?'pointer':'default';});
}
function trendChart(el){const D=MKT[S.year];
  barChart(el,MONTHS.map(x=>x.replace('月','')),[{name:'總收益',vals:D.rev,color:'#2a9ad4'},{name:'行銷花費',vals:D.spend,color:'#d07a22'}],
   {h:150,hi:S.m,extra:i=>`<br>ROAS：<b>${(D.rev[i]/D.spend[i]).toFixed(2)}x</b>${D.target[i]?`<br>達成率：${(D.rev[i]/D.target[i]*100).toFixed(1)}%`:''}`,click:i=>{S.m=i;$('#selMonth').value=i;refresh();}});}

/* ================================================================
   LOOP
   ================================================================ */
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(){
  if(document.body.classList.contains('data-view'))return;
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  ocean.material.uniforms.uTime.value=t;
  for(const f of FLOWS){const vis=S.flows[f.type]&&!(S.trace&&f.type!=='goods')&&!(S.trace==='back');
    f.tube.visible=vis;f.mat.uniforms.uTime.value=t;f.mat.uniforms.uOp.value=S.sel?((f.a===S.sel||f.b===S.sel)?1:.12):(S.trace?.25:.75);
    for(const d of f.dots){d.m.visible=vis&&(!S.sel||f.a===S.sel||f.b===S.sel);if(d.m.visible){const u=(t*f.speed+d.o)%1;d.m.position.copy(f.curve.getPointAt(u));}}}
  for(const k in ISL){const I=ISL[k];I.lift+=(I.liftT-I.lift)*Math.min(1,dt*6);I.group.position.y=I.lift;
    I.bh+=(I.bhT-I.bh)*Math.min(1,dt*4);I.beam.scale.y=I.bh;I.cap.position.y=TOP+1.2+I.bh;I.beam.material.opacity=.4+.15*Math.sin(t*2+I.ax);}
  for(const o of Object.values(OVR))if(o.grp.userData.spin)o.grp.userData.spin.rotation.y=t;
  CLOUDS.forEach((c,i)=>{c.position.x+=dt*(2+i%3);if(c.position.x>420)c.position.x=-420;});
  const now=performance.now();
  for(const tr of TRACE){const k=clamp((now-tr.t0)/900,0,1);tr.geo.setDrawRange(0,Math.floor(tr.total*ease(k))-(Math.floor(tr.total*ease(k))%3));}
  if(flight){const k=clamp((now-flight.s)/flight.ms,0,1),e=ease(k);camera.position.lerpVectors(flight.p0,flight.p1,e);controls.target.lerpVectors(flight.t0,flight.t1,e);if(k>=1)flight=null;}
  controls.update();
  composer.render();labelR.render(scene,camera);
}
function onResize(){renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);labelR.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
// Data workspaces do not require the 3D engine to finish loading.
document.querySelectorAll('#tabs .tab').forEach(b=>{
  if(['marketing','finance','operations','orders','shipping'].includes(b.dataset.tab))b.onclick=()=>{setTab(b.dataset.tab);$('#loader')?.remove();};
});
boot();
</script>
